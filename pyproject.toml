[project]
name = "surveycoach"
version = "0.1.0"
description = "Reviews MMC surveys against the approved rubric, mobile first."
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml", "pillow", "fastapi", "uvicorn", "playwright"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["surveycoach*"]

[tool.setuptools.package-data]
surveycoach = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to the real model (needs wibey and SURVEYCOACH_LIVE=1)"]
