<!doctype html><html lang="en"><meta charset="utf-8"><title>Synthetic survey zoo</title>
<style>body{font:16px sans-serif;max-width:360px}label{display:block}img{width:40px;height:20px}</style>
<main id="content"></main><script>
const stage=location.pathname.split('/').pop();
const root=document.getElementById('content');
if(stage==='choices') root.innerHTML=`<h1>Welcome, researcher!</h1>
<fieldset id="fruit"><legend>Which fruit — exactly?</legend>
<label><input type="radio" name="fruit" value="a" required>Apple &amp; pear</label>
<label><input type="radio" name="fruit" value="b">None of these</label></fieldset>
<fieldset><legend>Select your snacks.</legend><label><input type="checkbox" name="snack">Crackers</label>
<label><input type="checkbox" name="snack">Cheese</label></fieldset>
<img src="/asset.svg" alt="A synthetic rectangle"><button onclick="location.href='/text'">Next</button>`;
else if(stage==='text') root.innerHTML=`<fieldset><legend>Tell us why.</legend><textarea required></textarea></fieldset>
<label>How many?<input type="number" min="2" max="8" required></label>
<label>Choose a size.<select required><option value="">Choose</option><option value="s">Small</option><option value="l">Large</option></select></label>
<button onclick="location.href='/grid'">Continue</button>`;
else if(stage==='grid') root.innerHTML=`<fieldset><legend>Rate these products.</legend><table><thead><tr><th>Product</th><th>Bad</th><th>Good</th></tr></thead><tbody>
<tr><th>Texture</th><td><input type="radio" name="texture" value="1"></td><td><input type="radio" name="texture" value="2"></td></tr>
<tr><th>Flavor</th><td><input type="radio" name="flavor" value="1"></td><td><input type="radio" name="flavor" value="2"></td></tr>
</tbody></table></fieldset><button onclick="location.href='/final'">Next</button>`;
else if(stage==='final') root.innerHTML='<h1>Review your answers.</h1><button onclick="fetch(\'/submitted\')">Submit survey</button>';
else if(stage==='section-one') root.innerHTML=`<fieldset><legend>Section feedback.</legend><textarea id="section-answer"></textarea></fieldset><button onclick="if(document.getElementById('section-answer').value)location.href='/section-two'">Submit section</button>`;
else if(stage==='section-two') root.innerHTML=`<h1>Another section after Submit.</h1><button onclick="location.href='/thanks'">Finish</button>`;
else if(stage==='disabled-next') {
 root.innerHTML=`<label>Explain your answer.<textarea id="required-answer"></textarea></label><button disabled id="next-button">Next</button>`;
 document.getElementById('required-answer').oninput=()=>{document.getElementById('next-button').disabled=false;};
 document.getElementById('next-button').onclick=()=>{location.href='/thanks';};
}
else if(stage==='eligibility-wording') root.innerHTML=`<label>If not eligible, explain why.<textarea></textarea></label><button onclick="location.href='/thanks'">Next</button>`;
else if(stage==='compound-selects') root.innerHTML=`<fieldset><legend>Household</legend><label>Adults<select><option value="1">One adult</option><option value="2">Two adults</option></select></label><label>Children<select><option value="0">No children</option><option value="1">One child</option></select></label></fieldset><button onclick="location.href='/thanks'">Next</button>`;
else if(['identical-one','identical-two'].includes(stage)) root.innerHTML=`<section data-page-id="${stage}"><fieldset data-question-id="q-${stage}"><legend>Rate this product.</legend><label><input type="radio" name="rating">Good</label></fieldset><button onclick="location.href='${stage==='identical-one'?'/identical-two':'/thanks'}'">Next</button></section>`;
else if(stage==='validation-only') root.innerHTML=`<section data-page-id="same-page"><fieldset data-question-id="same-question"><legend>Provide a code.</legend><input type="text"></fieldset><p id="error"></p><button onclick="document.getElementById('error').textContent='Please answer the question correctly.'">Next</button></section>`;
else if(stage==='thanks') root.innerHTML='<h1>Thank you. Test response received.</h1>';
else if(stage==='screenout') root.innerHTML='<h1>You do not qualify for this survey.</h1>';
else if(stage==='aria') root.innerHTML=`<div role="radiogroup" aria-label="Pick a color."><div role="radio" tabindex="0" aria-checked="false" onclick="this.setAttribute('aria-checked','true')">Blue</div><div role="radio" tabindex="0" aria-checked="false">Green</div></div><button onclick="location.href='/final'">Next</button>`;
else if(stage==='redjade') root.innerHTML=`<div class="q"><div aria-label="Which of these did you do? *"><div class="taker-question-title-row"><div class="taker-title"><div><p>Which of these did you do?</p></div><span></span></div></div></div>
<div class="taker-question-slot-container"><div><div class="responsive-answer-grid-container">
<div class="answer-element-container"><button type="button" role="checkbox" aria-label="Carved a pumpkin" onclick="const i=this.querySelector('input');i.checked=!i.checked"><div><label for=""><span>Carved a pumpkin</span></label></div><div style="display:none"><input type="checkbox" hidden aria-hidden="true"></div></button></div>
<div class="answer-element-container"><button type="button" role="checkbox" aria-label="Watched a movie" onclick="const i=this.querySelector('input');i.checked=!i.checked"><div><label for=""><span>Watched a movie</span></label></div><div style="display:none"><input type="checkbox" hidden aria-hidden="true"></div></button></div>
</div></div></div></div>
<div><button type="button" id="prev-button" aria-hidden="true" style="display:none">Back</button><button type="button" id="next-button" onclick="location.href='/final'">Next</button></div>`;
else if(stage==='flash') root.innerHTML=`<h1>Transition fixture.</h1><button onclick="root.innerHTML='';setTimeout(()=>{root.innerHTML='<p>Loading...</p>'},150);setTimeout(()=>{location.href='/final'},500)">Next</button>`;
else if(stage==='keyup') {let typed='';root.innerHTML=`<fieldset><legend>Describe your evening.</legend><textarea id="t"></textarea></fieldset><button id="n">Next</button>`;document.getElementById('t').onkeyup=e=>{typed=e.target.value;};document.getElementById('n').onclick=()=>{const t=document.getElementById('t');if(!typed){t.value='';t.focus();return;}location.href='/final';};}
else if(['clear-button','prefilled-clear-button'].includes(stage)) {
  root.innerHTML=`<fieldset><legend>Describe a synthetic activity.</legend><textarea id="response"></textarea><button type="button" id="clear" aria-label="Clear" style="display:none"></button></fieldset><button id="next-button">Next</button>`;
  const field=document.getElementById('response'), clear=document.getElementById('clear');
  field.oninput=()=>{clear.style.display=field.value?'inline-block':'none';};
  clear.style.cssText+=';width:24px;height:24px';
  if(stage==='prefilled-clear-button'){field.value='Synthetic previous answer';clear.id='input-clear-response';clear.style.display='inline-block';}
  clear.onclick=()=>{field.value='';field.focus();fetch('/cleared');};
  document.getElementById('next-button').onclick=()=>{if(field.value)location.href='/final';};
}
else if(stage==='debounced-text') {
  let saved='', pending;
  root.innerHTML=`<fieldset><legend>Describe a synthetic activity.</legend><textarea id="response"></textarea></fieldset><button id="next-button">Next</button>`;
  document.getElementById('response').oninput=e=>{clearTimeout(pending);pending=setTimeout(()=>{saved=e.target.value;},200);};
  document.getElementById('next-button').onclick=()=>{if(saved)location.href='/final';};
}
else if(stage==='empty') root.innerHTML='<p>Still loading.</p>';
else if(stage==='unlabeled') root.innerHTML='<input type="radio" name="x"><input type="radio" name="x"><button>Next</button>';
else if(stage==='disabled') root.innerHTML='<label>Pick a size.<select><option value="">Choose</option><option disabled value="x">Unavailable</option></select></label><button>Next</button>';
else if(stage==='unsupported') root.innerHTML='<h1>Drag items to rank.</h1><canvas width="100" height="100"></canvas><button>Next</button>';
else if(stage==='stuck') root.innerHTML='<fieldset><legend>Pick one.</legend><label><input type="radio" name="x">Yes</label></fieldset><button>Next</button>';
else if(stage==='reveal') root.innerHTML=`<fieldset><legend>Choose.</legend><label><input type="checkbox" name="x" onchange="document.getElementById('extra').hidden=false">Other</label></fieldset><fieldset id="extra" hidden><legend>Explain your choice.</legend><input type="text"></fieldset><button>Next</button>`;
else if(stage==='threats') {root.innerHTML='<h1>Safety fixture.</h1><button>Finish</button>';fetch('/save',{method:'POST'});fetch('/complete_response');fetch('http://localhost:1/secret');fetch('https://example.com/secret');fetch('/redirect');}
else root.innerHTML='<h1>Unknown fixture.</h1>';
</script></html>
