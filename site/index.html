<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SurveyCoach: sample review</title>
  <meta name="description" content="See your survey through your members' eyes. Explore a fictional SurveyCoach review.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workflow.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="states.css"><link rel="stylesheet" href="header.css"><link rel="stylesheet" href="logo.css">

<body>
  <a class="skip" href="#workspace">Skip to review</a>
  <header id="app-header" class="review-header"></header>
  <main id="workspace" class="sample-shell" tabindex="-1">
    <section id="chapter-overview" aria-labelledby="overview-h"><h2 id="overview-h" tabindex="-1">Verdict</h2><p>Sample review · fictional data</p></section>
    <section id="chapter-improve" aria-labelledby="improve-h" hidden>
    <h2 id="improve-h" tabindex="-1">Fix</h2>
    <header id="topbar" class="topbar"></header>
    <div id="improve-bar" class="improve-bar" aria-label="Fix toolbar"></div>
    <div class="studio">
    <nav id="fix-queue" class="fix-queue" aria-label="Fix list"></nav>
    <section id="stage" class="stage" aria-labelledby="stage-h" tabindex="-1"></section>
    <aside id="coach" class="coach" aria-labelledby="coach-h"></aside>
    </div>
    <div id="my-changes" class="my-changes"></div>
    </section>
    <section id="chapter-share" aria-labelledby="share-h" hidden><h2 id="share-h" tabindex="-1">Sign off</h2></section>
  </main>

  <p id="status" class="sr-only" role="status" aria-live="polite"></p>

  <script src="dom.js"></script>

  <script src="playback.js"></script><script src="journey.js"></script><script src="member-preview.js"></script><script src="setup-card.js"></script><script src="version-delta.js"></script>
  <script src="verdict-cards.js"></script>
  <script src="overview.js"></script>
  <script src="fix-list.js"></script><script src="fix-parts.js"></script><script src="completion.js"></script><script src="my-changes.js"></script><script src="improve-actions.js"></script><script src="queue.js"></script><script src="suggestion.js"></script><script src="drafts.js"></script><script src="coach.js"></script>
