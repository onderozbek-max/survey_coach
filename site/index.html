<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SurveyCoach: sample review</title>
  <meta name="description" content="Sample-data demo of SurveyCoach, a mobile-first survey quality reviewer.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workflow.css">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="review-studio.css">
<link rel="stylesheet" href="chapters.css"><link rel="stylesheet" href="overview.css"></head>
<body>
  <a class="skip" href="#workspace">Skip to review</a>
  <header class="app-bar">
    <a href="local.html" class="brand">SurveyCoach</a>
    <nav id="chapter-nav" aria-label="Review steps">
      <a href="#overview" data-chapter="overview"><span class="step-n">1</span> Overview</a>
      <a href="#improve" data-chapter="improve"><span class="step-n">2</span> Improve</a>
      <a href="#share" data-chapter="share"><span class="step-n">3</span> Share</a>
    </nav>
    <a href="local.html" class="btn-text">My surveys</a>
  </header>
  <main id="workspace" class="sample-shell" tabindex="-1">
    <section id="chapter-overview" aria-labelledby="overview-h"><h2 id="overview-h" tabindex="-1">Overview</h2><p>Sample review · fictional data</p></section>
    <section id="chapter-improve" aria-labelledby="improve-h" hidden>
    <h2 id="improve-h" tabindex="-1">Improve</h2>
    <header id="topbar" class="topbar"></header>
    <div id="improve-bar" class="improve-bar" aria-label="Improve queue"></div>
    <div class="studio">
    <section id="stage" class="stage" aria-labelledby="stage-h" tabindex="-1"></section>
    <aside id="coach" class="coach" aria-labelledby="coach-h"></aside>
    </div>
    <p id="strip" class="strip"></p>
    </section>
    <section id="chapter-share" aria-labelledby="share-h" hidden><h2 id="share-h" tabindex="-1">Share</h2></section>
    <footer class="chapter-foot"><button type="button" id="about-review" class="btn-text">About this review</button></footer>
  </main>

  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  <script src="environment.js"></script>
  <script src="data.js"></script>
  <script src="dom.js"></script>
  <script src="icons.js"></script>
  <script src="diff.js"></script>
  <script src="toast.js"></script>
  <script src="chapters.js"></script>
  <script src="model.js"></script>
  <script src="issues.js"></script><script src="issue-list.js"></script>
  <script src="phone.js"></script>
  <script src="energy.js"></script>
  <script src="overview.js"></script>
  <script src="improve-actions.js"></script><script src="queue.js"></script><script src="coach.js"></script>
  <script src="app.js"></script>
</body>
</html>
