# MMC Survey Quality Rubric v2 as data. Source of truth for points.
# Approved document: docs/rubric/mmc-survey-rubric-v2.md. A test keeps them in sync.
version: "v2"
readiness:
  ready_min: 80
  almost_min: 60
length_targets_minutes:   # full credit up to the first number, partial up to the second, none beyond
  ihut: [10, 15]
  non_ihut_product: [5, 8]
  services_concept: [6, 10]
  market_research: [6, 10]
  community_pulse: [5, 8]
dimensions:
  - {id: D1, name: "First impression", points: 11}
  - {id: D2, name: "Respect for members' time", points: 13}
  - {id: D3, name: "Clear questions", points: 10}
  - {id: D4, name: "Fair and complete answers", points: 9}
  - {id: D5, name: "Neutral questions", points: 7}
  - {id: D6, name: "Built for the phone", points: 11}
  - {id: D7, name: "Images that work on a phone", points: 13}
  - {id: D8, name: "Engaging experience", points: 13}
  - {id: D9, name: "Community voice and tone", points: 6}
  - {id: D10, name: "Closing the loop", points: 7}
blockers:
  - {id: B1, title: "Leading question on the main research topic", check: "AI"}
  - {id: B2, title: "No valid answer", check: "Auto+AI"}
  - {id: B3, title: "Late screen-out", check: "Auto"}
  - {id: B4, title: "No intro page", check: "Auto"}
  - {id: B5, title: "Broken time promise", check: "Auto"}
  - {id: B6, title: "Asks for personal details it does not need", check: "AI"}
  - {id: B7, title: "Members can't see what they're asked to judge", check: "Auto+AI"}
criteria:
  - {id: "1.1", dimension: D1, points: 2, check: "Auto+AI", title: "Inviting, specific title in sentence case"}
  - {id: "1.2", dimension: D1, points: 3, check: "AI", title: "What we're exploring and why this member was asked"}
  - {id: "1.3", dimension: D1, points: 4, check: "AI", title: "Co-creator framing"}
  - {id: "1.4", dimension: D1, points: 2, check: "Auto", title: "Honest time estimate and the reward are stated"}
  - {id: "2.1", dimension: D2, points: 5, check: "Auto", title: "Length fits the survey type"}
  - {id: "2.2", dimension: D2, points: 3, check: "Auto+AI", title: "Qualifying questions come first"}
  - {id: "2.3", dimension: D2, points: 2, check: "AI", title: "Don't ask what we already know"}
  - {id: "2.4", dimension: D2, points: 2, check: "Auto", title: "Light typing load"}
  - {id: "2.5", dimension: D2, points: 1, check: "AI", title: "No repeats, smooth flow"}
  - {id: "3.1", dimension: D3, points: 3, check: "AI", title: "One idea per question"}
  - {id: "3.2", dimension: D3, points: 2, check: "Auto+AI", title: "Plain words"}
  - {id: "3.3", dimension: D3, points: 2, check: "Auto+AI", title: "Clear instructions and context"}
  - {id: "3.4", dimension: D3, points: 2, check: "Auto+AI", title: "Grammar and spelling"}
  - {id: "3.5", dimension: D3, points: 1, check: "AI", title: "Consistent terms"}
  - {id: "4.1", dimension: D4, points: 3, check: "AI", title: "Every member can find their answer"}
  - {id: "4.2", dimension: D4, points: 2, check: "Auto", title: "No overlapping choices"}
  - {id: "4.3", dimension: D4, points: 2, check: "AI", title: "A way out when needed"}
  - {id: "4.4", dimension: D4, points: 2, check: "Auto", title: "Honest scales"}
  - {id: "5.1", dimension: D5, points: 3, check: "AI", title: "No leading or loaded words"}
  - {id: "5.2", dimension: D5, points: 2, check: "AI", title: "No right answer framing"}
  - {id: "5.3", dimension: D5, points: 1, check: "AI", title: "No anchoring"}
  - {id: "5.4", dimension: D5, points: 1, check: "Auto", title: "Not a wall of agree/disagree"}
  - {id: "6.1", dimension: D6, points: 3, check: "Auto", title: "Fits on one screen"}
  - {id: "6.2", dimension: D6, points: 2, check: "Auto", title: "Short, tappable answer choices"}
  - {id: "6.3", dimension: D6, points: 2, check: "Auto", title: "Small grids, short scales"}
  - {id: "6.4", dimension: D6, points: 2, check: "Auto", title: "Thumb-friendly"}
  - {id: "6.5", dimension: D6, points: 2, check: "Auto", title: "Stays put and renders cleanly"}
  - {id: "7.1", dimension: D7, points: 2, check: "Auto+AI", title: "The right image is there"}
  - {id: "7.2", dimension: D7, points: 3, check: "Auto", title: "Phone-friendly shape"}
  - {id: "7.3", dimension: D7, points: 2, check: "Auto+AI", title: "Sharp and high resolution"}
  - {id: "7.4", dimension: D7, points: 2, check: "AI", title: "The product is the hero"}
  - {id: "7.5", dimension: D7, points: 2, check: "Auto+AI", title: "Fair image choices"}
  - {id: "7.6", dimension: D7, points: 2, check: "Auto+AI", title: "Readable, light, and accessible"}
  - {id: "8.1", dimension: D8, points: 2, check: "Auto+AI", title: "Easy, on-topic opener"}
  - {id: "8.2", dimension: D8, points: 2, check: "Auto", title: "Format variety that fits the content"}
  - {id: "8.3", dimension: D8, points: 4, check: "AI", title: "An insider moment"}
  - {id: "8.4", dimension: D8, points: 2, check: "AI", title: "Only relevant questions"}
  - {id: "8.5", dimension: D8, points: 2, check: "AI", title: "A good energy curve"}
  - {id: "8.6", dimension: D8, points: 1, check: "Auto", title: "Room to speak freely"}
  - {id: "9.1", dimension: D9, points: 4, check: "AI", title: "Warm and human"}
  - {id: "9.2", dimension: D9, points: 2, check: "Auto+AI", title: "Follows the content standards"}
  - {id: "10.1", dimension: D10, points: 4, check: "AI", title: "A genuine thank-you"}
  - {id: "10.2", dimension: D10, points: 0, check: "Auto", title: "Reward confirmed (inactive)"}
  - {id: "10.3", dimension: D10, points: 3, check: "AI", title: "Impact reminder"}
  - {id: "10.4", dimension: D10, points: 0, check: "AI", title: "What happens next (inactive until Q4 2026)"}
  - {id: "10.5", dimension: D10, points: 0, check: "Auto", title: "How was this survey (inactive)"}
